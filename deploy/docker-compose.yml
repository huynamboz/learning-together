# Production stack. Values come from deploy/.env, which deploy.sh creates on first run.
# The project name differs from the dev compose at the repo root so the two never share containers.
name: learning-together-prod

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgresql://toeic:${POSTGRES_PASSWORD:?}@postgres:5432/toeic?schema=public
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
  JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
  APP_ORIGIN: ${WEB_URL:?}
  AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY:-}
  STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
  STORAGE_BUCKET: ${STORAGE_BUCKET:-toeic-web}
  STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
  STORAGE_S3_REGION: ${STORAGE_S3_REGION:-auto}
  STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
  STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-}
  STORAGE_R2_ACCOUNT_ID: ${STORAGE_R2_ACCOUNT_ID:-}
  STORAGE_R2_ENDPOINT: ${STORAGE_R2_ENDPOINT:-}
  STORAGE_R2_ACCESS_KEY_ID: ${STORAGE_R2_ACCESS_KEY_ID:-}
  STORAGE_R2_SECRET_ACCESS_KEY: ${STORAGE_R2_SECRET_ACCESS_KEY:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: toeic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: toeic
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toeic -d toeic"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-off: `docker compose run --rm migrate` (deploy.sh does this on every deploy).
  migrate:
    build:
      context: ../backend
      target: build
    image: learning-together-migrate
    profiles: ["tools"]
    environment: *api-env
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../backend
      target: runtime
    image: learning-together-api
    restart: unless-stopped
    init: true
    environment:
      <<: *api-env
      PORT: 3010
    volumes:
      - api-data:/app/data
    ports:
      - "${API_BIND:-0.0.0.0}:${API_PORT:-3010}:3010"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 12

  web:
    build:
      context: ../frontend
    image: learning-together-web
    restart: unless-stopped
    init: true
    environment:
      NUXT_PUBLIC_API_BASE: ${API_URL:?}/api/v1
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-3011}:3011"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3011/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 12

volumes:
  postgres-data:
  redis-data:
  api-data:
